name: ASMR YouTube Automation Bot

on:
  schedule:
    # ভারতীয় সময় রাত ৯:৩০ টায় রান হওয়ার রুটিন (১ দিন পর পর)
    - cron: '30 16 */2 * *'
  workflow_dispatch: # এটি রাখার ফলে আপনি চাইলে যেকোনো সময় বাটন টিপেও বট চালু করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: কোড সংগ্রহ করা
      uses: actions/checkout@v3

    - name: পাইথন পরিবেশ তৈরি করা
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: প্রয়োজনীয় ডিজিটাল টুলস (Libraries) ইনস্টল করা
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: বটের ফাইলটি রান করা
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      run: python bot.py
      
